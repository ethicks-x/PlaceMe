[project]
name = "backend"
version = "0.1.0"
description = "placement portal application backend"
requires-python = ">=3.14"
dependencies = [
  "celery>=5.6.3",
  "dotenv>=0.9.9",
  "flask>=3.1.3",
  "flask-bcrypt>=1.0.1",
  "flask-cors>=6.0.5",
  "flask-jwt-extended>=4.7.4",
  "flask-migrate>=4.1.0",
  "redis>=8.1.0",
  "requests>=2.34.2",
]

[dependency-groups]
dev = []

[tool.ruff]
line-length = 99

[tool.ruff.lint]
# E/W = pycodestyle, F = Pyflakes, I = isort (import sorting), UP = pyupgrade
select = ["E", "W", "F", "I", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
