repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uvx ruff check --fix
        language: system
        files: ^backend/
        types: [python]

      - id: ruff-format
        name: ruff-format
        entry: uvx ruff format
        language: system
        types: [python]

  - repo: local
    hooks:
      - id: oxlint-local
        name: oxlint 
        entry: bunx oxlint
        language: system
        files: ^frontend/
        types_or: [javascript, jsx, ts, tsx]

      - id: oxfmt-local
        name: oxfmt 
        entry: bunx oxfmt --no-error-on-unmatched-pattern
        language: system
        files: ^frontend/
        types_or: [javascript, jsx, ts, tsx]
